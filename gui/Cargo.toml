[package]
name = "zeitstempel-gui"
version = "0.1.0"
edition = "2024"
description = "Drop-target GUI verifier for OpenTimestamps proofs"
repository = "https://github.com/xfaSts9cwY6VqLNTMAtR/zeitstempel"
license = "MIT"

[dependencies]
zeitstempel = { path = "../core" }
iced = { version = "0.14", features = ["tokio", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
webbrowser = "1.0"
